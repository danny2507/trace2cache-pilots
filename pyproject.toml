[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace2cache"
version = "0.1.0"
description = "Pilot harness for model-native runtime feedback to small code LMs"
requires-python = ">=3.10,<3.13"
dependencies = [
  "safetensors>=0.4",
  "torch==2.4.1+cu118",
  "transformers==4.44.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
